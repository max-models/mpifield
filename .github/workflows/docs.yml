name: Docs

# The Astro + Starlight site in docs/: hand-written pages, the executed notebooks and the API
# reference. Built on every push and pull request with the shared workflow of
# max-models/starlight-theme; deployed to GitHub Pages from devel.

on:
  push:
    branches: ["main", "devel"]
  pull_request:
    branches: ["main", "devel"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: max-models/starlight-theme/.github/workflows/docs.yml@v0.6.0
    with:
      # mpi4py and Open MPI: the MPI tutorial runs its script under mpiexec
      extras: docs mpi
      apt-packages: "libopenmpi-dev openmpi-bin"
      pre-build: uv run python docs/tools/examples.py
      smoke-paths: |
        getting-started/installation/index.html
        getting-started/quickstart/index.html
        tutorials/index.html
        tutorials/getting-started/index.html
        tutorials/mpi-and-halos/index.html
        tutorials/getting-started/getting_started.ipynb
        full-examples/index.html
        full-examples/01-cloud-in-cell-density/index.html
        full-examples/01-cloud-in-cell-density/plot-1.png
        full-examples/12-kernel-backends/index.html
        api/mpifield/index.html
        api/mpifield/field/index.html
